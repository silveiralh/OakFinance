# Supabase local (CLI 3.0.x) para desenvolvimento e CI (tech §8.2).
# Só serviços mínimos: sem studio, imgproxy, storage, realtime, analytics/logflare e vector.
# Nada aqui vale para produção: os projetos remotos são configurados pelo cliente (SETUP-05..07).
project_id = "oakfinance"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = false

[storage]
enabled = false

[analytics]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**", "http://localhost:4173/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 8

# Login por e-mail e senha só no ambiente local e no E2E (tech §8.4).
# Em produção o login é só com Google, configurado no painel do projeto.
[auth.email]
enabled = true
enable_confirmations = false
double_confirm_changes = false
secure_password_change = false

[auth.sms]
enabled = false

[auth.external.google]
enabled = false

# Cadastro fechado (ADR-17): só e-mails de app.allowed_emails. No ambiente local a allowlist vem do seed.sql.
[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/hook_before_user_created"

[edge_runtime]
enabled = true
policy = "per_worker"
deno_version = 2

# verify_jwt por função (tech §6.0): ligado por padrão (auth 'user').
# Desligar só nas funções chamadas pelo pg_cron (auth 'secret') e no pluggy-webhook (token próprio):
[functions.reminders-tick]
verify_jwt = false
