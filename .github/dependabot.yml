# Atualizações semanais e agrupadas (tech §2.2). Cada PR passa pelo portão completo.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      producao:
        dependency-type: production
      desenvolvimento:
        dependency-type: development
    ignore:
      # TypeScript fixado no 6.0 (ADR-13).
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns: ["*"]
