# Publica o preview de um PR no Cloudflare Pages (tech §8.7), depois do preview.yml.
# Roda no contexto de main (workflow_run): usa o Environment staging, mas só baixa o dist/
# estático já construído; nunca executa código do PR. Só PRs de branches deste repositório.
name: preview-deploy

on:
  workflow_run:
    workflows: [preview]
    types: [completed]

permissions:
  contents: read

env:
  WRANGLER_VERSION: 4.158.0

jobs:
  deploy:
    name: deploy de preview
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.CF_PAGES_PROJECT != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    permissions:
      actions: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        id: download
        continue-on-error: true
        with:
          name: preview-dist
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - if: steps.download.outcome != 'success'
        run: echo "::notice::Sem artefato de preview neste run."
      - uses: actions/setup-node@v5
        if: steps.download.outcome == 'success'
        with:
          node-version: 24
      - name: wrangler pages deploy
        if: steps.download.outcome == 'success'
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          branch="pr-$(printf '%s' "$HEAD_BRANCH" | tr -c 'a-zA-Z0-9-' '-' | cut -c1-28)"
          npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy dist \
            --project-name="$CF_PAGES_PROJECT" --branch="$branch" --commit-dirty=true
          echo "url=https://${branch}.${CF_PAGES_PROJECT}.pages.dev" >> "$GITHUB_OUTPUT"
      - name: comenta a URL no PR
        if: steps.deploy.outcome == 'success' && github.event.workflow_run.pull_requests[0].number
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          note=""
          if [ -f dist/.schema-pending ]; then
            note=" (schema pendente: o staging só recebe a migração depois do merge)"
          fi
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            -f body="Preview: $URL$note

          ---
          _Generated by [Claude Code](https://claude.ai/code)_" > /dev/null
