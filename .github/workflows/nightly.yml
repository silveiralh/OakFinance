# Bateria noturna (tech §8.6): E2E repetido para caçar instáveis, mutation testing do domínio,
# gitleaks no histórico completo, pnpm audit, dependências desatualizadas e keepalive em dia.
# Falha → issue "regressão: nightly".
name: nightly

on:
  schedule:
    - cron: "13 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  SUPABASE_CLI_VERSION: 3.0.0
  GITLEAKS_VERSION: 8.28.0

jobs:
  e2e-repeat:
    name: e2e --repeat-each=3
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          deno: "true"
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - run: supabase start
      - name: navegadores do Playwright
        timeout-minutes: 16
        run: |
          # O apt do runner às vezes trava num download: timeout curto por pacote, novas tentativas
          # e, entre tentativas, encerra o apt que ficou para trás (senão ele segura o lock do dpkg).
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
            | sudo tee /etc/apt/apt.conf.d/99oakfinance-retries > /dev/null
          for attempt in 1 2 3; do
            if timeout -k 10 300 pnpm --filter @oakfinance/web exec playwright install --with-deps chromium webkit; then
              exit 0
            fi
            echo "::warning::instalação dos navegadores falhou (tentativa $attempt de 3)"
            sudo pkill -9 -x apt-get || true
            sudo pkill -9 -x dpkg || true
            sleep 3
            sudo dpkg --configure -a || true
          done
          exit 1
      - name: playwright (3 projetos, 3 repetições)
        env:
          CI: "true"
        run: pnpm --filter @oakfinance/web e2e --repeat-each=3
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-e2e
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  mutation:
    name: mutation (Stryker)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm --filter @oakfinance/domain mutation

  gitleaks:
    name: gitleaks (histórico)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks no histórico completo
        run: |
          set -euo pipefail
          base="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL -o "$RUNNER_TEMP/$base" "$url/$base"
          curl -sSfL -o "$RUNNER_TEMP/checksums.txt" "$url/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd "$RUNNER_TEMP" && grep " $base\$" checksums.txt | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$base" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --source . --config .gitleaks.toml --redact --no-banner

  audit:
    name: audit e desatualizadas
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm audit --audit-level=moderate
      - name: dependências desatualizadas (informativo)
        run: |
          {
            echo "## Dependências desatualizadas"
            echo '```'
            pnpm -r outdated || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  keepalive-check:
    name: keepalive nas últimas 48 h
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts
      - env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-keepalive.sh

  regression:
    name: abre issue de regressão
    needs: [e2e-repeat, mutation, gitleaks, audit, keepalive-check]
    if: failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          scripts/open-regression-issue.sh "regressão: nightly" "$RUN_URL"
